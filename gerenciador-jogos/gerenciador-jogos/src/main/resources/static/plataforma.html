<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciador de Jogos de Videogame - Plataformas</title>
    <link rel="stylesheet" href="css/estilo.css">
</head>
<body>
    <div class="tela">
        <header><h1>Plataformas</h1></header>
        <main>
            <div id="mensagem" class="mensagem oculto" role="alert"></div>
            <form id="formulario-plataforma" class="formulario" novalidate>
                <h2>Cadastrar plataforma</h2>

                <div class="campo">
                    <label class="rotulo" for="nome">Nome</label>
                    <input type="text" id="nome" maxlength="100">
                </div>

                <div class="acoes-centro">
                    <button type="submit" id="btn-salvar" class="botao azul">Salvar</button>
                    <a class="botao vermelho" href="index.html">Voltar</a>
                </div>
            </form>
        </main>
        <footer class="rodape">
            <p>Julio Seabra da Silva / Felipe Maeta dos Santos / Turma 3B Noturno / 2026</p>
            <p>Usou IA: SIM - Claude (Anthropic, modelo Claude Sonnet 5.5): geração do código do backend (Spring Boot) e do frontend (HTML, CSS e JS)</p>
        </footer>
    </div>

    <script src="js/app.js"></script>
    <script src="js/plataforma.js"></script>
</body>
</html>

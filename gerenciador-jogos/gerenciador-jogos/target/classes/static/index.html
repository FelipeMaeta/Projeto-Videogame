<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciador de Jogos de Videogame</title>
    <link rel="stylesheet" href="css/estilo.css">
</head>
<body>
    <div class="tela">
        <header><h1>Gerenciador de Jogos de Videogame</h1></header>
        <main>
            <div id="mensagem" class="mensagem oculto" role="alert"></div>
            <section id="lista-jogos"></section>
            <div class="acoes-centro">
                <a class="botao azul" href="form.html">Incluir novo jogo</a>
                <a class="botao azul" href="plataforma.html">Cadastrar plataforma</a>
            </div>
        </main>
        <footer class="rodape">
            <p>Julio Seabra da Silva / Felipe Maeta dos Santos / Turma 3B Noturno / 2026</p>
            <p>Usou IA: SIM - Claude (Anthropic, modelo Claude Sonnet 5.5): geração do código do backend (Spring Boot) e do frontend (HTML, CSS e JS)</p>
        </footer>
    </div>

    <dialog id="dialogo-exclusao">
        <p id="texto-exclusao"></p>
        <div class="acoes-dialogo">
            <button type="button" id="btn-sim" class="botao azul">Sim</button>
            <button type="button" id="btn-nao" class="botao vermelho">Não</button>
        </div>
    </dialog>

    <script src="js/app.js"></script>
    <script src="js/index.js"></script>
</body>
</html>

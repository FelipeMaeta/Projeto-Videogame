# Configurações padrão disponíveis: https://docs.spring.io/spring-boot/appendix/application-properties/index.html

spring.application.name=demo

# --- Servidor Web ---
# server.port=8080
# server.servlet.context-path=/  # Opcional: definir um contexto base para a API

# --- Jackson (serialização JSON formatada) ---
spring.jackson.serialization.INDENT_OUTPUT=true

# ATENÇÃO: As configurações de banco de dados e JPA abaixo NÃO são adicionadas pelo
# Spring Initializr oficial. Foram incluídas apenas para fins didáticos.

# --- Datasource (h2) ---
spring.datasource.url=jdbc:h2:mem:demo
# Trocar a linha acima pelas duas linhas abaixo se H2 usar arquivos
# No Windows, o arquivo será criado no diretório C:\Users\<NOME_USUARIO>\demo-h2-data.mv
# spring.datasource.url=jdbc:h2:file:~/demo-h2-data
# spring.sql.init.platform=h2

spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# --- JPA / Hibernate ---
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.hibernate.ddl-auto=update

